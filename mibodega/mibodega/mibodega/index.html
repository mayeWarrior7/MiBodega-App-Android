<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MiBodega.com</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="login-container">

    <div class="form-card">

        <img
            src="assets/logo.png"
            alt="Logo MiBodega"
            class="logo">

      

            <p class="subtitle">
                Control inteligente de inventarios
            </p>

        <form id="loginForm">

    <input
        type="email"
        placeholder="E-mail"
        required>

    <input
        type="password"
        placeholder="Contraseña"
        required>

    <a href="recuperar.html" class="forgot-password">
        ¿Olvidaste tu contraseña?
    </a>

    <button type="submit">
        Iniciar Sesión
    </button>

</form>

        <p>
            ¿No tienes cuenta?
            <a href="registro.html">Regístrate</a>
        </p>

    </div>

</div>

    <script src="js/auth.js"></script>

</body>

</html>
