<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle Producto | MiBodega</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="product-card">

        <h2>📦 Agua Cristal 600ml</h2>

        <div class="stock-info">

            <div class="info-box">
                <h4>Stock Disponible</h4>
                <span id="stockActual">144</span>
            </div>

            <div class="info-box">
                <h4>Precio Unitario</h4>
                <span>$1.800</span>
            </div>

        </div>

        <div class="stock-bar">
            <div class="stock-level nivel-alto"></div>
        </div>

        <!-- AJUSTE RAPIDO -->

        <div class="stock-control">

            <h3>Stock actual</h3>

            <span class="stock-value" id="stockNumero">
                144
            </span>

            <small>unidades</small>

            <p class="stock-minimo">
                Mínimo requerido: 20 und
            </p>

            <h4>Ajuste rápido</h4>

            <div class="quick-actions">

                <button type="button" onclick="actualizarStock(-10)">
                    -10
                </button>

                <button type="button" onclick="actualizarStock(-5)">
                    -5
                </button>

                <button type="button" onclick="actualizarStock(-1)">
                    -1
                </button>

                <button type="button" onclick="actualizarStock(1)">
                    +1
                </button>

                <button type="button" onclick="actualizarStock(5)">
                    +5
                </button>

                <button type="button" onclick="actualizarStock(10)">
                    +10
                </button>

            </div>

        </div>

        <div class="details">

            <p><strong>Categoría:</strong> Bebidas</p>

            <p><strong>Código:</strong> BEB-001</p>

            <p><strong>Unidad:</strong> UND</p>

            <p><strong>Valor Inventario:</strong> $259.200</p>

        </div>

    </div>

    <nav class="bottom-nav">

        <a href="dashboard.html">
            🏠 Inicio
        </a>

        <a href="inventario.html">
            📦 Inventario
        </a>

        <a href="perfil.html">
            👤 Perfil
        </a>

    </nav>

    <script src="js/app.js"></script>

</body>

</html>
